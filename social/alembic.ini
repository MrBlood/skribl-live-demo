# Alembic configuration for THE SITE'S OWN TABLES (social_..., social/models.py).
#
# A chain of its own, beside Skribl's, with a version table of its own
# (social_alembic_version), so the two never touch each other's tables or
# stamps:
#
#     python -m alembic upgrade head                       # Skribl's chain
#     python -m alembic -c social/alembic.ini upgrade head # the site's
#
# gunicorn.conf.py runs the second one once per start, before any worker
# takes a request, so a deploy that starts gunicorn (Render's start command,
# the Procfile) brings the site's tables up to date without either command
# changing. DATABASE_URL overrides sqlalchemy.url, as in Skribl's chain; this
# default is the demo's own SQLite file, for a bare local run from the repo.
[alembic]
script_location = %(here)s/migrations
prepend_sys_path = %(here)s/..
sqlalchemy.url = sqlite:///instance/skribl_demo.db

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
