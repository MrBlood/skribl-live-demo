# Alembic configuration for Skribl's own tables. See skribl/migrations/env.py —
# DATABASE_URL overrides sqlalchemy.url, so this default only matters for a bare
# local run.
[alembic]
script_location = skribl/migrations
prepend_sys_path = .
sqlalchemy.url = sqlite:///instance/skribl_demo.db

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
