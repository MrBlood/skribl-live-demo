<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Skribl · Flip Mode (prototype)</title>
<style>
  :root{
    --bg:#06070a; --surface:#12141a; --surface-2:#171b23; --raised:#1c212c;
    --accent:#7c5cff; --accent-bright:#9179ff; --accent-glow:rgba(124,92,255,.45);
    --text:#f6f7f9; --text-2:#9aa2b1; --text-dim:#5b6270;
    --hairline:rgba(255,255,255,.08); --hairline-2:rgba(255,255,255,.14);
    --r:16px; --ease:cubic-bezier(.22,.61,.36,1);
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  html,body{margin:0;height:100%;}
  body{
    background:radial-gradient(1200px 700px at 50% -10%, #0d0f16 0%, var(--bg) 60%);
    color:var(--text); font:15px/1.4 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,system-ui,sans-serif;
    display:flex; flex-direction:column; height:100dvh; overflow:hidden;
  }
  /* ---------- header ---------- */
  .top{display:flex;align-items:center;gap:12px;padding:12px 16px;}
  .back{width:36px;height:36px;border-radius:50%;display:grid;place-items:center;flex-shrink:0;
      background:var(--surface-2);border:1px solid var(--hairline);color:var(--text-2);text-decoration:none;margin-right:2px;transition:filter .15s;}
  .back:hover{filter:brightness(1.2);} .back svg{width:18px;height:18px;}
  .brand{display:flex;align-items:center;gap:10px;font-weight:700;letter-spacing:-.01em;}
  .logo{width:30px;height:30px;border-radius:9px;background:
      conic-gradient(from 210deg,#7c5cff,#5b8cff,#c06bff,#7c5cff);
      display:grid;place-items:center;box-shadow:0 4px 14px var(--accent-glow);}
  .logo svg{width:17px;height:17px;color:#fff;}
  .brand small{color:var(--text-2);font-weight:600;font-size:12px;letter-spacing:.02em;
      border:1px solid var(--hairline);padding:2px 8px;border-radius:999px;margin-left:2px;}
  .spacer{flex:1;}
  .counter{font-variant-numeric:tabular-nums;color:var(--text-2);font-weight:600;font-size:13px;
      background:var(--surface-2);border:1px solid var(--hairline);padding:6px 12px;border-radius:999px;}
  .counter b{color:var(--text);}
  .btn{display:inline-flex;align-items:center;gap:7px;border:1px solid var(--hairline-2);
      background:var(--surface-2);color:var(--text);padding:8px 14px;border-radius:999px;
      font-weight:600;font-size:14px;cursor:pointer;transition:filter .15s,box-shadow .2s ease,background .2s;}
  .btn svg{width:16px;height:16px;}
  .btn:hover{filter:brightness(1.12);}
  .btn.primary{background:var(--accent);border-color:transparent;box-shadow:0 3px 12px var(--accent-glow);}
  .btn.play{min-width:104px;justify-content:center;}
  .btn.playing{background:#20242e;border-color:var(--hairline-2);box-shadow:none;}
  .seg{display:inline-flex;background:var(--surface-2);border:1px solid var(--hairline);border-radius:999px;padding:3px;}
  .seg button{border:0;background:transparent;color:var(--text-2);font-weight:600;font-size:13px;
      padding:5px 11px;border-radius:999px;cursor:pointer;font-variant-numeric:tabular-nums;transition:.15s;}
  .seg button.on{background:var(--raised);color:var(--text);}
  .toggle{display:inline-flex;align-items:center;gap:8px;color:var(--text-2);font-size:13px;font-weight:600;cursor:pointer;user-select:none;}
  .switch{width:38px;height:22px;border-radius:999px;background:#20242e;border:1px solid var(--hairline);position:relative;transition:.2s;}
  .switch i{position:absolute;top:2px;left:2px;width:16px;height:16px;border-radius:50%;background:#8b93a3;transition:.2s var(--ease);}
  .toggle.on .switch{background:var(--accent);border-color:transparent;}
  .toggle.on .switch i{left:18px;background:#fff;}

  /* ---------- stage ---------- */
  .stage{flex:1;display:flex;align-items:center;justify-content:center;min-height:0;padding:6px 16px 0;position:relative;}
  .pad-wrap{position:relative;}
  /* stacked-paper edges = "flipbook" signature */
  .pad-wrap::before,.pad-wrap::after{content:"";position:absolute;inset:0;border-radius:18px;
      background:var(--surface);border:1px solid var(--hairline);z-index:-1;}
  .pad-wrap::before{transform:translate(7px,7px);opacity:.5;}
  .pad-wrap::after{transform:translate(3.5px,3.5px);opacity:.8;}
  canvas#pad{display:block;border-radius:18px;background:#0e1017;border:1px solid var(--hairline-2);
      box-shadow:0 24px 60px rgba(0,0,0,.5);touch-action:none;cursor:crosshair;}
  .flip-badge{position:absolute;top:14px;left:14px;z-index:5;background:rgba(9,11,16,.7);backdrop-filter:blur(8px);
      border:1px solid var(--hairline);border-radius:999px;padding:5px 12px;font-size:12px;font-weight:700;
      letter-spacing:.03em;color:var(--accent-bright);display:none;}
  body.playing .flip-badge{display:block;}
  body.playing canvas#pad{cursor:default;}

  /* ---------- tools ---------- */
  .tools{display:flex;align-items:center;justify-content:center;gap:10px;padding:12px;flex-wrap:wrap;}
  .swatches{display:flex;gap:7px;background:var(--surface-2);border:1px solid var(--hairline);padding:6px;border-radius:999px;}
  .sw{width:24px;height:24px;border-radius:50%;cursor:pointer;border:2px solid transparent;transition:transform .12s;}
  .sw:hover{transform:scale(1.1);} .sw.on{border-color:#fff;}
  .tool-btn{width:40px;height:40px;border-radius:50%;display:grid;place-items:center;background:var(--surface-2);
      border:1px solid var(--hairline);color:var(--text-2);cursor:pointer;transition:.15s;}
  .tool-btn:hover{filter:brightness(1.15);} .tool-btn.on{color:#fff;border-color:var(--accent);box-shadow:inset 0 0 0 100px rgba(124,92,255,.14);}
  .tool-btn svg{width:19px;height:19px;}
  .size{display:flex;align-items:center;gap:9px;background:var(--surface-2);border:1px solid var(--hairline);padding:6px 14px;border-radius:999px;}
  .size input{accent-color:var(--accent);}

  /* ---------- frame strip ---------- */
  .strip-wrap{border-top:1px solid var(--hairline);background:rgba(10,12,18,.6);}
  .strip{display:flex;gap:10px;align-items:center;padding:12px 16px;overflow-x:auto;scrollbar-width:thin;}
  .frame{position:relative;flex:0 0 auto;width:92px;height:66px;border-radius:11px;overflow:hidden;
      border:1px solid var(--hairline-2);background:#0e1017;cursor:pointer;transition:transform .12s,border-color .15s;}
  .frame:hover{transform:translateY(-2px);}
  .frame.on{border-color:var(--accent);box-shadow:0 0 0 2px var(--accent),0 8px 20px var(--accent-glow);}
  .frame canvas{width:100%;height:100%;display:block;}
  .frame .num{position:absolute;top:4px;left:5px;font-size:10px;font-weight:700;color:var(--text-2);
      background:rgba(9,11,16,.72);border-radius:5px;padding:1px 5px;font-variant-numeric:tabular-nums;}
  .frame .del{position:absolute;top:3px;right:3px;width:18px;height:18px;border-radius:5px;border:0;
      background:rgba(9,11,16,.72);color:#c98;display:none;align-items:center;justify-content:center;cursor:pointer;font-size:12px;line-height:1;}
  .frame:hover .del{display:flex;}
  .addcol{flex:0 0 auto;display:flex;flex-direction:column;gap:6px;}
  .addbtn{width:92px;border:1px dashed var(--hairline-2);background:transparent;color:var(--text-2);
      border-radius:10px;padding:8px 0;font-weight:600;font-size:12px;cursor:pointer;transition:.15s;display:flex;align-items:center;justify-content:center;gap:5px;}
  .addbtn:hover{color:var(--text);border-color:var(--accent);background:rgba(124,92,255,.06);}
  .addbtn.mini{padding:5px 0;font-size:11px;}
  .hint{color:var(--text-dim);font-size:12px;text-align:center;padding:0 16px 12px;}
  .hint b{color:var(--text-2);font-weight:600;}
</style>
</head>
<body>
  <div class="top">
    <a href="/" class="back" title="Back to Skribl Pad" aria-label="Back to Skribl Pad">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"/></svg>
    </a>
    <div class="brand">
      <span class="logo"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2l2.4 6.5L21 9l-5 4.2L17.5 21 12 17l-5.5 4L8 13.2 3 9l6.6-.5z"/></svg></span>
      Skribl <small>FLIP MODE</small>
    </div>
    <div class="spacer"></div>
    <div class="counter">Frame <b id="cur">1</b> / <span id="total">1</span></div>
    <div class="seg" id="fps" title="Frames per second">
      <button data-fps="6">6</button><button data-fps="12" class="on">12</button><button data-fps="24">24</button>
    </div>
    <div class="toggle on" id="onion"><span class="switch"><i></i></span>Onion skin</div>
    <button class="btn play primary" id="play">
      <svg viewBox="0 0 24 24" fill="currentColor"><path d="M6 4l14 8-14 8z"/></svg><span>Flip it</span>
    </button>
  </div>

  <div class="stage">
    <div class="pad-wrap">
      <div class="flip-badge">▶ FLIPPING</div>
      <canvas id="pad"></canvas>
    </div>
  </div>

  <div class="tools">
    <div class="swatches" id="swatches"></div>
    <div class="size"><span style="color:var(--text-2);font-size:12px;font-weight:600;">Size</span>
      <input id="size" type="range" min="2" max="34" value="7"></div>
    <button class="tool-btn" id="erase" title="Eraser"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 20H7L3 16a2 2 0 010-3l9-9a2 2 0 013 0l5 5a2 2 0 010 3l-8 8"/><path d="M9 13l5 5"/></svg></button>
    <button class="tool-btn" id="undo" title="Undo stroke"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 14L4 9l5-5"/><path d="M4 9h11a5 5 0 015 5v0a5 5 0 01-5 5H8"/></svg></button>
    <button class="tool-btn" id="clear" title="Clear frame"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 6h18M8 6V4h8v2M19 6l-1 14H6L5 6"/></svg></button>
  </div>

  <div class="strip-wrap">
    <div class="strip" id="strip"></div>
  </div>
  <div class="hint">Each new page starts as a <b>copy of the current one</b> — nudge, erase, redraw to animate. Toggle onion skin to see the frame beneath. Then hit <b>Flip it</b>.</div>

<script>
/* =========================================================================
   Flip Mode prototype. Deliberately mirrors the pad's real render path:
   a frame is a strokes list; drawDot/drawLine paint to the canvas; a static
   repaint (paintStatic) rebuilds a whole frame; onion skin = the previous
   frame painted faintly first (the same "base layer" idea clearAndRestore uses).
   ========================================================================= */
const COLORS = ["#ffffff","#7c5cff","#5b8cff","#ff5c8a","#ffd15c","#4bd6a0","#1a1d26"];
const DPR = Math.min(window.devicePixelRatio||1, 2);
const CW = 640, CH = 460;                 // logical canvas size

const pad = document.getElementById('pad');
const ctx = pad.getContext('2d');
pad.style.width = CW+'px'; pad.style.height = CH+'px';
pad.width = CW*DPR; pad.height = CH*DPR; ctx.scale(DPR,DPR);

let frames = [ newFrame() ];              // each frame = { strokes: [ {color,size,erase,pts:[{x,y}]} ] }
let idx = 0;                              // current frame
let color = "#ffffff", size = 7, erasing = false, onion = true, fps = 12;
let drawing = false, cur = null, playing = false, playTimer = null;

function newFrame(){ return { strokes: [] }; }
function frame(){ return frames[idx]; }

/* ---- core render primitives (same shape as app.js) ---- */
function drawDot(c, x, y, col, s, erase){
  c.globalCompositeOperation = erase ? 'destination-out' : 'source-over';
  c.beginPath(); c.arc(x,y,s/2,0,Math.PI*2); c.fillStyle = erase ? '#000' : col; c.fill();
  c.globalCompositeOperation = 'source-over';
}
function drawLine(c, x1,y1,x2,y2, col, s, erase){
  c.globalCompositeOperation = erase ? 'destination-out' : 'source-over';
  c.strokeStyle = erase ? '#000' : col; c.lineWidth = s; c.lineCap='round'; c.lineJoin='round';
  c.beginPath(); c.moveTo(x1,y1); c.lineTo(x2,y2); c.stroke();
  c.globalCompositeOperation = 'source-over';
}
// paint one stroke onto a context
function paintStroke(c, st){
  const p = st.pts; if(!p.length) return;
  drawDot(c, p[0].x, p[0].y, st.color, st.size, st.erase);
  for(let i=1;i<p.length;i++) drawLine(c, p[i-1].x,p[i-1].y, p[i].x,p[i].y, st.color, st.size, st.erase);
}
// paint a whole frame's strokes (≈ paintStrokesStatic)
function paintStatic(c, strokes){ for(const st of strokes) paintStroke(c, st); }

/* ---- main pad render: onion skin (base layer) + current frame ---- */
function render(){
  ctx.clearRect(0,0,CW,CH);
  if(onion && !playing && idx>0){
    ctx.globalAlpha = 0.22;               // previous frame as a faded base
    paintStatic(ctx, frames[idx-1].strokes);
    ctx.globalAlpha = 1;
  }
  paintStatic(ctx, frame().strokes);
}

/* ---- drawing ---- */
function pos(e){
  const r = pad.getBoundingClientRect();
  const t = e.touches ? e.touches[0] : e;
  return { x:(t.clientX-r.left)*(CW/r.width), y:(t.clientY-r.top)*(CH/r.height) };
}
function down(e){
  if(playing) return; e.preventDefault();
  drawing = true; cur = { color, size, erase:erasing, pts:[pos(e)] };
  frame().strokes.push(cur); render();
}
function move(e){
  if(!drawing) return; e.preventDefault();
  cur.pts.push(pos(e)); render();
}
function up(){ if(!drawing) return; drawing=false; cur=null; refreshThumb(idx); }
pad.addEventListener('pointerdown',down);
pad.addEventListener('pointermove',move);
window.addEventListener('pointerup',up);

/* ---- frame strip ---- */
const strip = document.getElementById('strip');
function buildStrip(){
  strip.innerHTML='';
  frames.forEach((f,i)=>{
    const el=document.createElement('div'); el.className='frame'+(i===idx?' on':'');
    el.innerHTML=`<div class="num">${i+1}</div><button class="del" title="Delete">✕</button><canvas></canvas>`;
    el.addEventListener('click',ev=>{ if(ev.target.classList.contains('del')){delFrame(i);return;} go(i); });
    strip.appendChild(el);
    drawThumb(el.querySelector('canvas'), f);
  });
  const col=document.createElement('div'); col.className='addcol';
  col.innerHTML=`<button class="addbtn" id="addcopy">＋ Page <span style="opacity:.6">(copy)</span></button>
                 <button class="addbtn mini" id="addblank">＋ Blank</button>`;
  strip.appendChild(col);
  col.querySelector('#addcopy').addEventListener('click',()=>addFrame(true));
  col.querySelector('#addblank').addEventListener('click',()=>addFrame(false));
  document.getElementById('total').textContent=frames.length;
  document.getElementById('cur').textContent=idx+1;
}
function drawThumb(cv,f){
  cv.width=92*DPR; cv.height=66*DPR; const c=cv.getContext('2d'); c.scale(92*DPR/CW,66*DPR/CH);
  c.clearRect(0,0,CW,CH); paintStatic(c,f.strokes);
}
function refreshThumb(i){
  const el=strip.children[i]; if(el) drawThumb(el.querySelector('canvas'),frames[i]);
}
function deepCopy(f){ return { strokes: f.strokes.map(s=>({color:s.color,size:s.size,erase:s.erase,pts:s.pts.map(p=>({x:p.x,y:p.y}))})) }; }
function addFrame(copy){
  const f = copy ? deepCopy(frame()) : newFrame();
  frames.splice(idx+1,0,f); idx++; buildStrip(); render();
  strip.children[idx].scrollIntoView({behavior:'smooth',inline:'center',block:'nearest'});
}
function delFrame(i){
  if(frames.length===1){ frames[0]=newFrame(); idx=0; } 
  else { frames.splice(i,1); if(idx>=frames.length) idx=frames.length-1; }
  buildStrip(); render();
}
function go(i){ idx=i; buildStrip(); render(); }

/* ---- flip playback ---- */
const playBtn=document.getElementById('play');
function play(){
  if(frames.length<2) return;
  playing=true; document.body.classList.add('playing');
  playBtn.classList.add('playing'); playBtn.querySelector('span').textContent='Stop';
  let i=0;
  const step=()=>{ idx=i%frames.length; render(); document.getElementById('cur').textContent=idx+1; i++; };
  step(); playTimer=setInterval(step, 1000/fps);
}
function stop(){
  playing=false; document.body.classList.remove('playing');
  playBtn.classList.remove('playing'); playBtn.querySelector('span').textContent='Flip it';
  clearInterval(playTimer); buildStrip(); render();
}
playBtn.addEventListener('click',()=> playing?stop():play());

/* ---- tools ---- */
const sw=document.getElementById('swatches');
COLORS.forEach(col=>{
  const b=document.createElement('div'); b.className='sw'+(col===color?' on':''); b.style.background=col;
  if(col==='#1a1d26') b.style.boxShadow='inset 0 0 0 1px rgba(255,255,255,.2)';
  b.addEventListener('click',()=>{ color=col; erasing=false; document.getElementById('erase').classList.remove('on');
    [...sw.children].forEach(x=>x.classList.remove('on')); b.classList.add('on'); });
  sw.appendChild(b);
});
document.getElementById('size').addEventListener('input',e=>size=+e.target.value);
document.getElementById('erase').addEventListener('click',e=>{ erasing=!erasing; e.currentTarget.classList.toggle('on',erasing); });
document.getElementById('undo').addEventListener('click',()=>{ frame().strokes.pop(); render(); refreshThumb(idx); });
document.getElementById('clear').addEventListener('click',()=>{ frame().strokes=[]; render(); refreshThumb(idx); });
document.getElementById('onion').addEventListener('click',e=>{ onion=!onion; e.currentTarget.classList.toggle('on',onion); render(); });
document.getElementById('fps').addEventListener('click',e=>{ const b=e.target.closest('button'); if(!b)return;
  fps=+b.dataset.fps; [...e.currentTarget.children].forEach(x=>x.classList.remove('on')); b.classList.add('on');
  if(playing){ stop(); play(); } });

buildStrip(); render();
</script>
</body>
</html>
