<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Skribl · Flip Mode</title>
<!-- Same design system as the editor: real tokens, .header/.btn/.icon-btn, logo. -->
<link rel="stylesheet" href="{{ url_for('static', filename='skribl/styles.css', v='93') }}">
<style>
  /* Flip-only styling, built on the shared tokens from styles.css. */
  body.flip-app { overflow: hidden; }
  .flip-app .app { height: 100dvh; }
  .flip-app .header { gap: 10px; }
  .flip-badge {
    font-size: 11px; font-weight: 700; letter-spacing: .04em; color: var(--accent-bright);
    border: 1px solid var(--hairline-strong); border-radius: var(--r-pill); padding: 2px 8px; margin-left: 2px;
  }
  .flip-actions { display: flex; align-items: center; gap: 8px; margin-left: auto; }

  .seg { display: inline-flex; background: var(--surface-control); border: 1px solid var(--hairline-strong); border-radius: var(--r-pill); padding: 3px; }
  .seg button { border: 0; background: transparent; color: var(--text-secondary); font: inherit; font-weight: 600; font-size: 13px;
    padding: 5px 11px; border-radius: var(--r-pill); cursor: pointer; font-variant-numeric: tabular-nums; transition: background .15s var(--ease), color .15s var(--ease); }
  .seg button.on { background: var(--surface-control-hover); color: var(--text-primary); }

  .onion { display: inline-flex; align-items: center; gap: 8px; color: var(--text-secondary); font-size: 13px; font-weight: 600;
    cursor: pointer; user-select: none; padding: 6px 8px; }
  .onion .sw { width: 34px; height: 20px; border-radius: var(--r-pill); background: var(--surface-control); border: 1px solid var(--hairline-strong); position: relative; transition: background .2s var(--ease); }
  .onion .sw i { position: absolute; top: 2px; left: 2px; width: 14px; height: 14px; border-radius: 50%; background: #8b93a3; transition: left .2s var(--spring), background .2s; }
  .onion.on .sw { background: var(--accent); border-color: transparent; }
  .onion.on .sw i { left: 16px; background: #fff; }

  .btn.flip-play { background: var(--accent); border-color: transparent; color: #fff; box-shadow: 0 3px 12px var(--accent-glow); min-width: 96px; justify-content: center; }
  .btn.flip-play.playing { background: var(--surface-control); color: var(--text-primary); box-shadow: none; }

  /* Editor-style fitted canvas — no fixed size, so it never overflows. */
  .flip-stage { flex: 1; display: flex; align-items: center; justify-content: center; min-height: 0; padding: 6px 12px 0; position: relative; }
  .flip-wrap { position: relative; line-height: 0; }
  #pad { display: block; border-radius: var(--r-frame); background: var(--surface-raised);
    border: 1px solid var(--hairline-strong); box-shadow: 0 20px 50px rgba(0,0,0,.45); touch-action: none; cursor: crosshair; }
  body.playing #pad { cursor: default; }
  .flip-live { position: absolute; top: 12px; left: 12px; z-index: 4; display: none; align-items: center; gap: 6px;
    background: rgba(9,11,16,.72); border: 1px solid var(--hairline); border-radius: var(--r-pill); padding: 4px 11px;
    font-size: 12px; font-weight: 700; letter-spacing: .03em; color: var(--accent-bright); }
  body.playing .flip-live { display: inline-flex; }

  .flip-tools { display: flex; align-items: center; justify-content: center; gap: 8px; padding: 12px; flex-wrap: wrap; }
  .swatches { display: flex; gap: 7px; background: var(--surface-control); border: 1px solid var(--hairline-strong); padding: 6px; border-radius: var(--r-pill); }
  .sw-dot { width: 24px; height: 24px; border-radius: 50%; cursor: pointer; border: 2px solid transparent; transition: transform .12s var(--spring); }
  .sw-dot:hover { transform: scale(1.1); } .sw-dot.on { border-color: #fff; }
  .size-ctl { display: flex; align-items: center; gap: 9px; background: var(--surface-control); border: 1px solid var(--hairline-strong); padding: 6px 14px; border-radius: var(--r-pill); color: var(--text-secondary); font-size: 12px; font-weight: 600; }
  .size-ctl input { accent-color: var(--accent); }
  .t-btn { width: 40px; height: 40px; border-radius: 50%; display: grid; place-items: center; background: var(--surface-control);
    border: 1px solid var(--hairline-strong); color: var(--text-secondary); cursor: pointer; transition: filter .15s ease, color .15s ease; }
  .t-btn:hover { filter: brightness(1.12); } .t-btn.on { color: var(--text-primary); border-color: var(--accent); }
  .t-btn svg { width: 19px; height: 19px; }

  .strip-wrap { border-top: 1px solid var(--hairline); background: rgba(10,12,18,.55); }
  .strip { display: flex; gap: 10px; align-items: center; padding: 12px; overflow-x: auto; scrollbar-width: thin; }
  .frame { position: relative; flex: 0 0 auto; width: 88px; height: 62px; border-radius: 10px; overflow: hidden;
    border: 1px solid var(--hairline-strong); background: var(--surface-raised); cursor: pointer; transition: transform .12s var(--spring), border-color .15s ease; }
  .frame:hover { transform: translateY(-2px); }
  .frame.on { border-color: var(--accent); box-shadow: 0 0 0 2px var(--accent); }
  .frame canvas { width: 100%; height: 100%; display: block; }
  .frame .num { position: absolute; top: 4px; left: 5px; font-size: 10px; font-weight: 700; color: var(--text-secondary);
    background: rgba(9,11,16,.7); border-radius: 5px; padding: 1px 5px; font-variant-numeric: tabular-nums; }
  .frame .del { position: absolute; top: 3px; right: 3px; width: 18px; height: 18px; border-radius: 5px; border: 0;
    background: rgba(9,11,16,.72); color: var(--text-secondary); display: none; align-items: center; justify-content: center; cursor: pointer; padding: 0; }
  .frame .del svg { width: 11px; height: 11px; }
  .frame .del:hover { color: #ff8a8a; }
  .frame:hover .del { display: flex; }
  .addcol { flex: 0 0 auto; display: flex; flex-direction: column; gap: 6px; }
  .addbtn { width: 88px; border: 1px dashed var(--hairline-strong); background: transparent; color: var(--text-secondary);
    border-radius: 10px; padding: 8px 0; font: inherit; font-weight: 600; font-size: 12px; cursor: pointer;
    transition: color .15s, border-color .15s, background .15s; display: flex; align-items: center; justify-content: center; gap: 5px; }
  .addbtn:hover { color: var(--text-primary); border-color: var(--accent); background: rgba(124,92,255,.06); }
  .addbtn.mini { padding: 5px 0; font-size: 11px; }
  .flip-hint { color: var(--text-dim); font-size: 12px; text-align: center; padding: 0 16px 12px; }
  .flip-hint b { color: var(--text-secondary); font-weight: 600; }
  @media (hover:hover) { .t-btn:hover, .addbtn:hover { filter: none; } }
</style>
</head>
<body class="flip-app">
  <div class="app">
    <div class="header">
      <a href="/" class="icon-btn" title="Back to Skribl Pad" aria-label="Back to Skribl Pad">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"/></svg>
      </a>
      <div class="brand">
        <svg viewBox="0 0 100 100">
          <defs><linearGradient id="g" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#7c5cff"/><stop offset="1" stop-color="#5b8cff"/></linearGradient></defs>
          <rect width="100" height="100" rx="28" fill="url(#g)"/>
          <polygon fill="#fff" points="50,14 56.5,38.7 81.2,32 63,50 81.2,68 56.5,61.3 50,86 43.5,61.3 18.8,68 37,50 18.8,32 43.5,38.7"/>
        </svg>
        <span><span class="brand-word">Skribl</span></span>
        <span class="flip-badge">FLIP</span>
      </div>
      <div class="actions flip-actions" id="actions">
        <span class="seg" id="fps" title="Frames per second">
          <button data-fps="6">6</button><button data-fps="12" class="on">12</button><button data-fps="24">24</button>
        </span>
        <span class="onion" id="onion" role="switch" aria-checked="false" title="Onion skin — show the frame beneath">
          <span class="sw"><i></i></span>Onion
        </span>
        <button type="button" class="btn flip-play" id="play">
          <svg viewBox="0 0 24 24" fill="currentColor"><path d="M6 4l14 8-14 8z"/></svg><span>Flip it</span>
        </button>
      </div>
    </div>

    <div class="flip-stage">
      <div class="flip-wrap">
        <span class="flip-live">▶ FLIPPING</span>
        <canvas id="pad"></canvas>
      </div>
    </div>

    <div class="flip-tools">
      <div class="swatches" id="swatches"></div>
      <div class="size-ctl">Size <input id="size" type="range" min="2" max="34" value="7"></div>
      <button class="t-btn" id="erase" title="Eraser"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 20H7L3 16a2 2 0 010-3l9-9a2 2 0 013 0l5 5a2 2 0 010 3l-8 8"/><path d="M9 13l5 5"/></svg></button>
      <button class="t-btn" id="undo" title="Undo stroke"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 14L4 9l5-5"/><path d="M4 9h11a5 5 0 015 5v0a5 5 0 01-5 5H8"/></svg></button>
      <button class="t-btn" id="clear" title="Clear frame"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 6h18M8 6V4h8v2M19 6l-1 14H6L5 6"/></svg></button>
    </div>

    <div class="strip-wrap"><div class="strip" id="strip"></div></div>
    <div class="flip-hint">Each new page is a <b>copy of the current one</b> — nudge, erase, redraw to animate. Toggle <b>Onion</b> to see the frame beneath. Then hit <b>Flip it</b>.</div>
  </div>

<script>
/* Flip Mode — mirrors the pad's real render path: a frame is a strokes list;
   drawDot/drawLine paint to the canvas; paintStatic rebuilds a whole frame;
   onion skin = the previous frame painted faintly first (the pad's base-layer
   idea). No stroke glow — same clean rendering as the editor. */
const COLORS = ["#ffffff","#7c5cff","#5b8cff","#ff5c8a","#ffd15c","#4bd6a0","#0e1017"];
const DPR = Math.min(window.devicePixelRatio||1, 2);
const CW = 640, CH = 460;                 // authored logical size

const pad = document.getElementById('pad');
const ctx = pad.getContext('2d');
pad.width = CW*DPR; pad.height = CH*DPR; ctx.scale(DPR,DPR);

// Fit the canvas into the available stage, preserving aspect — like the editor.
// Backing store stays at CW×CH×DPR; only the display size changes. Pointer coords
// are ratio-mapped, so drawing stays correct at any display size.
function fitPad(){
  const stage = document.querySelector('.flip-stage');
  const availW = stage.clientWidth - 24, availH = stage.clientHeight - 6;
  const scale = Math.max(0.1, Math.min(availW/CW, availH/CH, 1.4));
  pad.style.width = Math.round(CW*scale)+'px';
  pad.style.height = Math.round(CH*scale)+'px';
}
window.addEventListener('resize', fitPad);

let frames = [ newFrame() ];              // frame = { strokes:[ {color,size,erase,pts:[{x,y}]} ] }
let idx = 0;
let color = "#ffffff", size = 7, erasing = false, onion = false, fps = 12;
let drawing = false, cur = null, playing = false, playTimer = null;

function newFrame(){ return { strokes: [] }; }
function frame(){ return frames[idx]; }

/* ---- render primitives (same shape as app.js, no glow) ---- */
function drawDot(c, x, y, col, s, erase){
  c.globalCompositeOperation = erase ? 'destination-out' : 'source-over';
  c.beginPath(); c.arc(x,y,s/2,0,Math.PI*2); c.fillStyle = erase ? '#000' : col; c.fill();
  c.globalCompositeOperation = 'source-over';
}
function drawLine(c, x1,y1,x2,y2, col, s, erase){
  c.globalCompositeOperation = erase ? 'destination-out' : 'source-over';
  c.strokeStyle = erase ? '#000' : col; c.lineWidth = s; c.lineCap='round'; c.lineJoin='round';
  c.beginPath(); c.moveTo(x1,y1); c.lineTo(x2,y2); c.stroke();
  c.globalCompositeOperation = 'source-over';
}
function paintStroke(c, st){
  const p = st.pts; if(!p.length) return;
  drawDot(c, p[0].x, p[0].y, st.color, st.size, st.erase);
  for(let i=1;i<p.length;i++) drawLine(c, p[i-1].x,p[i-1].y, p[i].x,p[i].y, st.color, st.size, st.erase);
}
function paintStatic(c, strokes){ for(const st of strokes) paintStroke(c, st); }

function render(){
  ctx.clearRect(0,0,CW,CH);
  if(onion && !playing && idx>0){
    ctx.globalAlpha = 0.25;
    paintStatic(ctx, frames[idx-1].strokes);
    ctx.globalAlpha = 1;
  }
  paintStatic(ctx, frame().strokes);
}

/* ---- drawing (pointer = mouse + touch) ---- */
function pos(e){
  const r = pad.getBoundingClientRect();
  return { x:(e.clientX-r.left)*(CW/r.width), y:(e.clientY-r.top)*(CH/r.height) };
}
pad.addEventListener('pointerdown', e=>{
  if(playing) return; e.preventDefault();
  try{ pad.setPointerCapture(e.pointerId); }catch(_){}
  drawing = true; cur = { color, size, erase:erasing, pts:[pos(e)] };
  frame().strokes.push(cur); render();
});
pad.addEventListener('pointermove', e=>{ if(!drawing) return; e.preventDefault(); cur.pts.push(pos(e)); render(); });
window.addEventListener('pointerup', ()=>{ if(!drawing) return; drawing=false; cur=null; refreshThumb(idx); });

/* ---- frame strip ---- */
const strip = document.getElementById('strip');
const DEL_SVG = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg>';
function buildStrip(){
  strip.innerHTML='';
  frames.forEach((f,i)=>{
    const el=document.createElement('div'); el.className='frame'+(i===idx?' on':'');
    el.innerHTML='<div class="num">'+(i+1)+'</div><button class="del" title="Delete frame">'+DEL_SVG+'</button><canvas></canvas>';
    el.addEventListener('click',ev=>{ if(ev.target.closest('.del')){ delFrame(i); return; } go(i); });
    strip.appendChild(el); drawThumb(el.querySelector('canvas'), f);
  });
  const col=document.createElement('div'); col.className='addcol';
  col.innerHTML='<button class="addbtn" id="addcopy">＋ Page</button><button class="addbtn mini" id="addblank">＋ Blank</button>';
  strip.appendChild(col);
  col.querySelector('#addcopy').addEventListener('click',()=>addFrame(true));
  col.querySelector('#addblank').addEventListener('click',()=>addFrame(false));
}
function drawThumb(cv,f){
  cv.width=88*DPR; cv.height=62*DPR; const c=cv.getContext('2d');
  c.setTransform(88*DPR/CW,0,0,62*DPR/CH,0,0);
  c.clearRect(0,0,CW,CH); paintStatic(c,f.strokes);
}
function refreshThumb(i){ const el=strip.children[i]; if(el) drawThumb(el.querySelector('canvas'),frames[i]); }
function deepCopy(f){ return { strokes: f.strokes.map(s=>({color:s.color,size:s.size,erase:s.erase,pts:s.pts.map(p=>({x:p.x,y:p.y}))})) }; }
function addFrame(copy){
  const f = copy ? deepCopy(frame()) : newFrame();
  frames.splice(idx+1,0,f); idx++; buildStrip(); render();
  const el = strip.children[idx]; if(el) el.scrollIntoView({behavior:'smooth',inline:'center',block:'nearest'});
}
function delFrame(i){
  if(frames.length===1){ frames[0]=newFrame(); idx=0; }
  else { frames.splice(i,1); if(idx>=frames.length) idx=frames.length-1; else if(i<idx) idx--; }
  buildStrip(); render();
}
function go(i){ idx=i; buildStrip(); render(); }

/* ---- flip playback ---- */
const playBtn=document.getElementById('play');
function play(){
  if(frames.length<2) return;
  playing=true; document.body.classList.add('playing');
  playBtn.classList.add('playing'); playBtn.querySelector('span').textContent='Stop';
  let i=0;
  const step=()=>{ idx=i%frames.length; render(); i++; };
  step(); playTimer=setInterval(step, 1000/fps);
}
function stop(){
  playing=false; document.body.classList.remove('playing');
  playBtn.classList.remove('playing'); playBtn.querySelector('span').textContent='Flip it';
  clearInterval(playTimer); buildStrip(); render();
}
playBtn.addEventListener('click',()=> playing?stop():play());

/* ---- tools ---- */
const sw=document.getElementById('swatches');
COLORS.forEach(col=>{
  const b=document.createElement('div'); b.className='sw-dot'+(col===color?' on':''); b.style.background=col;
  if(col==='#0e1017') b.style.boxShadow='inset 0 0 0 1px rgba(255,255,255,.18)';
  b.addEventListener('click',()=>{ color=col; erasing=false; document.getElementById('erase').classList.remove('on');
    [...sw.children].forEach(x=>x.classList.remove('on')); b.classList.add('on'); });
  sw.appendChild(b);
});
document.getElementById('size').addEventListener('input',e=>size=+e.target.value);
document.getElementById('erase').addEventListener('click',e=>{ erasing=!erasing; e.currentTarget.classList.toggle('on',erasing); });
document.getElementById('undo').addEventListener('click',()=>{ frame().strokes.pop(); render(); refreshThumb(idx); });
document.getElementById('clear').addEventListener('click',()=>{ frame().strokes=[]; render(); refreshThumb(idx); });
const onionEl=document.getElementById('onion');
onionEl.addEventListener('click',()=>{ onion=!onion; onionEl.classList.toggle('on',onion); onionEl.setAttribute('aria-checked',String(onion)); render(); });
document.getElementById('fps').addEventListener('click',e=>{ const b=e.target.closest('button'); if(!b)return;
  fps=+b.dataset.fps; [...e.currentTarget.children].forEach(x=>x.classList.remove('on')); b.classList.add('on'); if(playing){ stop(); play(); } });

fitPad(); buildStrip(); render();
window.addEventListener('load', fitPad);
</script>
</body>
</html>
