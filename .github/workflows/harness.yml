name: harness

# CI runs the same run_harness.sh a developer runs — not a reduced subset —
# across three jobs, because the environments genuinely disagree:
#   sqlite    the default developer path
#   postgres  real parallelism, where the rate-limiter reservation race lives
#   mp4       a browser with an H.264 encoder, which Playwright's Chromium lacks

# WHO RUNS WHAT — and WHY, which was written down wrong.
#
# The full battery below (three jobs, 89 suites each, 40-90 minutes a job) used
# to run on EVERY pull request AND every merge: one shipped fix cost ~6 hours
# of runner time, and an ordinary productive day (7 merges) meant 30 full runs
# in a day. cancel-in-progress (below) had already closed the superseded-push
# hole; it cannot help when every run is for a distinct event.
#
# THAT WAS RECORDED HERE AS A BILL, AND IT IS NOT ONE. This repository is
# public and every job below runs on `ubuntu-latest`, a standard GitHub-hosted
# runner. Standard runners on public repositories have no minute allowance and
# no per-minute charge, so "burned the entire monthly Actions allowance" —
# what this note used to say — describes an allowance this repository does not
# have. Whatever the visibility was on the day it happened, it is public now.
# Runner SIZE is the billable knob (4-core and up, GPU, macOS, self-hosted),
# and nothing here turns it.
#
# THE TRIM IS STILL RIGHT, FOR THE OTHER REASON. Three jobs at 40-90 minutes
# is a long time to sit on a pull request whether or not anyone is invoiced
# for it. So: pull requests get ONE fast smoke job (the boot suite — does the
# app start and serve at all), and the full three-job battery runs only on
# pushes to main and on manual dispatch. The working rhythm this repo actually
# has — the full affected suites run locally before every push, and their
# counts are quoted in each PR — is what makes that safe: CI's job on a PR is
# to catch a broken push, not to re-verify a verified one. Merges to main keep
# the complete record.
#
# Keeping the wrong reason attached to a right decision is how the decision
# gets reversed by the first person who checks the reason. Corrected in v280,
# during a release whose whole subject was claims that had stopped being true.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# SUPERSEDED PULL-REQUEST RUNS ARE CANCELLED; MAIN RUNS ARE NOT.
#
# Without this, every push to a branch under review started a fresh set of three
# 20-30 minute jobs and left the previous set running to completion against a
# commit nobody would ever merge. On a branch that gets four or five pushes in a
# session that is most of the minutes spent -- and the account ran out of them,
# free allowance and paid top-up both, which is how this got noticed.
#
# The group is per-ref, so two different pull requests never cancel each other.
#
# cancel-in-progress is an EXPRESSION rather than a flat true, and that is the
# point of the block. On a pull request the older run is testing a commit that
# has been replaced and its result would be read by nobody, so cancelling costs
# nothing. On main each commit is a thing that shipped: its run is the only
# record that it was verified, so those queue behind each other instead.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  smoke:
    name: smoke (boot + source suites)
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r constraints.txt --require-hashes
          # The harness's OWN bounds, not whatever is newest (EXT-P1-10).
          # This was `pip install playwright Pillow`, which ignored
          # harness/requirements.txt -- the file that exists because
          # playwright's version is coupled to a Chromium build number
          # on disk, and pins a deliberately narrow range for it.
          pip install -r harness/requirements.txt
      - name: Install Chromium
        run: python -m playwright install --with-deps chromium
      # THE PR GATE IS MORE THAN A BOOT NOW (EXT-P1-9). It was verify_boot
      # alone, with the full battery running only AFTER merge -- and this
      # repository's own history records fixtures going red on main that no
      # pull request had a chance to catch (three of them in v304, red on
      # every push since #183). The suites below need no browser and no
      # server, so they cost about a minute for ~765 assertions: measured at
      # 59s locally, against ~45 minutes for the full sqlite job. That ratio
      # is the whole argument. Browser and timing suites stay on the
      # post-merge run, where a slow job costs nobody's attention.
      #
      # ADD A SUITE HERE ONLY IF IT NEEDS NEITHER. One that quietly wants the
      # shared server passes locally and fails here, and a PR gate that cries
      # wolf gets ignored, which is worse than not having one.
      - name: Run the boot and source suites
        run: |
          ./harness/run_harness.sh \
            verify_boot.py verify_docs.py verify_seam.py \
            verify_txcontract.py verify_privacy.py verify_migrations.py \
            verify_createpost.py verify_sweepjob.py verify_deletion.py \
            verify_backfill.py verify_hostseams.py
      # run_harness.sh exits 0 on a skip, so a suite that quietly declined to
      # run would leave this job green having proved nothing. None of these is
      # designed to skip, so ANY skip is a failure -- the guard is generalised
      # from the single-suite version it replaces rather than naming one file.
      - name: Fail if any of them only SKIPPED
        run: |
          set -eu
          if grep -qE '^  verify_[a-z_]+\.py: SKIPPED' harness/LAST-RUN.txt; then
            echo "::error::a PR-gate suite skipped; this job proved less than it looks" >&2
            grep -E ': SKIPPED' harness/LAST-RUN.txt >&2 || true
            exit 1
          fi
          echo "every PR-gate suite ran"

  sqlite:
    name: harness (sqlite)
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    # 90, not 30: the harness grew to 89 suites / ~4k assertions and a full run
    # takes 45-60 minutes on these runners. At 30 both jobs were cancelled
    # mid-run on every push once the runner outage of Aug 31 lifted — red that
    # looked like code and was budget.
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          # The lock is hash-pinned, so it installs on its own; '-r requirements
          # -c constraints' fails because --require-hashes rejects version ranges.
          pip install -r constraints.txt --require-hashes
          # playwright and Pillow are TEST-only and deliberately absent from
          # constraints.txt, which is the app's runtime lock (it is what the
          # Procfile's gunicorn installs) -- neither is imported by skribl/ or
          # app.py. Pillow backs verify_cssplit's pixel gate, and that suite
          # exits 1 rather than SKIPping when it is missing, so leaving it out
          # fails the job rather than degrading it.
          # The harness's OWN bounds, not whatever is newest (EXT-P1-10).
          # This was `pip install playwright Pillow`, which ignored
          # harness/requirements.txt -- the file that exists because
          # playwright's version is coupled to a Chromium build number
          # on disk, and pins a deliberately narrow range for it.
          pip install -r harness/requirements.txt
      - name: Install Chromium
        # --with-deps pulls the system libraries headless Chromium needs;
        # without it the browser launches and dies on a missing shared object.
        run: python -m playwright install --with-deps chromium
      - name: Run the harness
        run: ./harness/run_harness.sh
      # THE JOB THAT RUNS ALL 100 SUITES WAS THE ONE WITH NO SKIP GUARD, while
      # the two jobs that run a single suite each had one. run_harness.sh exits
      # 0 on a skip -- correctly, because two lanes are DESIGNED to skip here:
      # Chromium ships no H.264 encoder, and this job has no cluster. But that
      # makes a skip invisible to the exit code, so if the browser install had
      # failed, every browser suite would have reported SKIPPED and this job
      # would have gone green having demonstrated almost nothing.
      #
      # The guard is therefore not "no skips" -- that can never hold here --
      # but "only the two that are supposed to". Read off the structured
      # per-suite lines of the run record, not its prose summary.
      - name: Fail if any suite but the two designed lanes SKIPPED
        run: |
          set -eu
          unexpected=$(grep -E '^  verify_[a-z0-9_]+\.py: SKIPPED' harness/LAST-RUN.txt \
                       | sed -E 's/^  (verify_[a-z0-9_]+\.py):.*/\1/' \
                       | grep -vxE 'verify_mp4\.py|verify_postgres\.py' || true)
          if [ -n "$unexpected" ]; then
            echo "::error::suites skipped that this job is supposed to run:"
            echo "$unexpected" >&2
            grep -E '^  verify_[a-z0-9_]+\.py: SKIPPED' harness/LAST-RUN.txt >&2 || true
            exit 1
          fi
          echo "only the two designed lanes skipped"
      - name: Upload the run record
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: last-run-sqlite
          path: harness/LAST-RUN.txt

  postgres:
    name: harness (postgresql)
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    # 90, not 30: the harness grew to 89 suites / ~4k assertions and a full run
    # takes 45-60 minutes on these runners. At 30 both jobs were cancelled
    # mid-run on every push once the runner outage of Aug 31 lifted — red that
    # looked like code and was budget.
    timeout-minutes: 90

    services:
      db:
        image: postgres:16
        env:
          POSTGRES_USER: skribl
          POSTGRES_PASSWORD: skribl
          POSTGRES_DB: skribl
        ports: ["5432:5432"]
        # Without a health check the steps start before the server accepts
        # connections and the first suite fails for the wrong reason.
        #
        # -U/-d, not a bare pg_isready: the probe runs as root inside the
        # container and pg_isready defaults --username to the OS user, so every
        # 10s probe opened a connection as "root", which this image never
        # creates. The gate still PASSED -- pg_isready reports the server as
        # accepting connections even when it rejects the role -- so nothing
        # broke, but the container logged
        #     FATAL:  role "root" does not exist
        # roughly 140 times across a 24-minute run. That is the log someone
        # reads when a run has genuinely failed, and a wall of FATAL lines in
        # it invites exactly the wrong diagnosis.
        options: >-
          --health-cmd "pg_isready -U skribl -d skribl"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgresql://skribl:skribl@127.0.0.1:5432/skribl
      # verify_postgres.py spawns its own gunicorn and resolves this DSN itself.
      # A SEPARATE database from DATABASE_URL above, created empty by the step
      # that precedes the harness: this suite migrates from scratch, and the
      # database the harness itself uses has had create_all() run over it.
      SKRIBL_PG_DSN: postgresql://skribl:skribl@127.0.0.1:5432/skribl_suite

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          # The lock is hash-pinned, so it installs on its own; '-r requirements
          # -c constraints' fails because --require-hashes rejects version ranges.
          pip install -r constraints.txt --require-hashes
          # playwright and Pillow are TEST-only and deliberately absent from
          # constraints.txt, which is the app's runtime lock (it is what the
          # Procfile's gunicorn installs) -- neither is imported by skribl/ or
          # app.py. Pillow backs verify_cssplit's pixel gate, and that suite
          # exits 1 rather than SKIPping when it is missing, so leaving it out
          # fails the job rather than degrading it.
          # The harness's OWN bounds, not whatever is newest (EXT-P1-10).
          # This was `pip install playwright Pillow`, which ignored
          # harness/requirements.txt -- the file that exists because
          # playwright's version is coupled to a Chromium build number
          # on disk, and pins a deliberately narrow range for it.
          pip install -r harness/requirements.txt
      - name: Install Chromium
        run: python -m playwright install --with-deps chromium
      - name: Create the empty database verify_postgres migrates into
        # verify_postgres.py runs the alembic chain from scratch, so it needs a
        # database nothing has created tables in behind its back -- the same
        # requirement the "Verify the migration chain" step below already spells
        # out for migrations_only, and for the same reason.
        #
        # SKRIBL_PG_DSN used to point at `skribl`, the database run_harness.sh
        # resets with metadata.create_all(). The tables were therefore already
        # present with no alembic_version row, the baseline revision tried to
        # create them again, and the suite SKIPPED:
        #     could not migrate the schema on PostgreSQL
        # with the server logging `relation "skribl_posts" already exists`.
        #
        # It skipped every time, so the one suite that exercises PostgreSQL has
        # never actually run in CI -- and because run_harness.sh exits non-zero
        # on any skip, the job went red without a single failing assertion,
        # which is how it stayed unexamined. Exactly the v209 lesson in
        # A run that reports `skipped 1` is
        # not the run you think it is.
        run: |
          PGPASSWORD=skribl psql -h 127.0.0.1 -U skribl -d skribl \
            -c "DROP DATABASE IF EXISTS skribl_suite;" \
            -c "CREATE DATABASE skribl_suite OWNER skribl;"
      - name: Run the harness
        # This job BLOCKS. It was non-blocking while the database-backed limiter
        # admitted zero of twelve concurrent posts; that is fixed (per-identity
        # advisory lock, skribl/ratelimit.py), and the concurrency race is
        # exactly what this job exists to catch, so a non-blocking version of it
        # would be worse than none.
        #
        # run_harness.sh honours an externally supplied DATABASE_URL and resets
        # by dropping and recreating Skribl's tables, so this is a genuine
        # PostgreSQL run with per-run isolation intact.
        run: ./harness/run_harness.sh
      - name: Verify the migration chain on PostgreSQL
        # A SEPARATE, EMPTY database. run_harness.sh resets the supplied one with
        # metadata.create_all(), which leaves the tables present with no
        # alembic_version row — so the baseline revision would then try to create
        # tables that already exist. Exercise the chain where nothing has been
        # created behind its back.
        env:
          DATABASE_URL: postgresql://skribl:skribl@127.0.0.1:5432/migrations_only
        run: |
          PGPASSWORD=skribl psql -h 127.0.0.1 -U skribl -d skribl \
            -c "DROP DATABASE IF EXISTS migrations_only;" \
            -c "CREATE DATABASE migrations_only OWNER skribl;"
          python -m alembic upgrade head
          python -m alembic check
      - name: Fail if verify_postgres only SKIPPED
        # A skip contributes zero assertions and proves nothing about
        # PostgreSQL. On the one job whose purpose is to prove it, a skip is a
        # failure. NOT the mp4 job's "suites skipped : 0" test: that job runs a
        # single suite, this one runs the whole battery and legitimately skips
        # verify_mp4. The per-suite line is the thing to read.
        run: |
          if grep -Eq '^  verify_postgres\.py: ok' harness/LAST-RUN.txt; then
            echo "verify_postgres ran."
          else
            echo "verify_postgres did not report ok on the job that exists to run it." >&2
            grep -E '^  verify_postgres' harness/LAST-RUN.txt >&2 || true
            exit 1
          fi
      - name: Write the PostgreSQL attestation
        # THE SAME ARGUMENT AS THE MP4 ATTESTATION, one lane later. Until now a
        # seal could only say `verify_postgres.py` was skipped and CLAIMED by a
        # CI job — existence of a job, not a result — so `release status` could
        # never be better than LOCAL PASS however green that job was. Three
        # outside reviews called that truthful and incomplete, in those terms.
        #
        # Written AFTER the migration-chain step above, so a green attestation
        # means the suite ran AND the chain applies to an empty database. The
        # TREE HASH is the load-bearing field exactly as it is for mp4:
        # release_run.py refuses one that names a different tree, because an
        # attestation about different code is worse than none.
        run: |
          python - <<'PY' > harness/POSTGRES-ATTESTATION.txt
          import re, sys
          sys.path.insert(0, "harness")
          import release_run as r
          rec = open("harness/LAST-RUN.txt").read()
          n = re.search(r"^  verify_postgres\.py: ok — (\d+)/", rec, re.M)
          print("tree:", r.tree_hash())
          print("engine: postgresql")
          print("result: PASS")
          print("assertions:", n.group(1) if n else "?")
          import datetime
          print("generated:",
                datetime.datetime.now(datetime.timezone.utc)
                .strftime("%Y-%m-%dT%H:%M:%SZ"))
          PY
          cat harness/POSTGRES-ATTESTATION.txt
      - name: Upload the PostgreSQL attestation
        uses: actions/upload-artifact@v4
        with:
          name: postgres-attestation
          path: harness/POSTGRES-ATTESTATION.txt
      - name: Upload the run record
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: last-run-postgres
          path: harness/LAST-RUN.txt
      - name: Print the PostgreSQL attestation LAST
        # A SECOND cat, and not a redundant one. The attestation has to be
        # carried into the sealing tree by hand, because release_run.py reads it
        # from the local working tree and this environment's egress proxy
        # refuses GitHub's artifact blob storage (403 on CONNECT - measured,
        # productionresultssa15.blob.core.windows.net). CLAUDE.md's remedy is to
        # transcribe from the job's own log, and that only works if the line is
        # REACHABLE.
        #
        # It was not. This job has a service container, so teardown dumps ~65
        # lines of PostgreSQL container log after the last step, and the cat
        # beside the write step sits ~166 lines from the end - past what the log
        # reader could return. The mp4 job has no service container, which is
        # the only reason the same protocol worked there.
        #
        # So the file is printed again as the last thing the job does. Cheap,
        # and it makes the documented remedy actually available on this lane.
        if: always()
        run: cat harness/POSTGRES-ATTESTATION.txt || echo "no attestation written"

  mp4:
    name: mp4 export (real Chrome)
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      SKRIBL_BROWSER_CHANNEL: chrome
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          # The lock is hash-pinned, so it installs on its own; '-r requirements
          # -c constraints' fails because --require-hashes rejects version ranges.
          pip install -r constraints.txt --require-hashes
          # playwright and Pillow are TEST-only and deliberately absent from
          # constraints.txt, which is the app's runtime lock (it is what the
          # Procfile's gunicorn installs) -- neither is imported by skribl/ or
          # app.py. Pillow backs verify_cssplit's pixel gate, and that suite
          # exits 1 rather than SKIPping when it is missing, so leaving it out
          # fails the job rather than degrading it.
          # The harness's OWN bounds, not whatever is newest (EXT-P1-10).
          # This was `pip install playwright Pillow`, which ignored
          # harness/requirements.txt -- the file that exists because
          # playwright's version is coupled to a Chromium build number
          # on disk, and pins a deliberately narrow range for it.
          pip install -r harness/requirements.txt
      - name: Install Chromium and real Chrome
        # chromium serves the app for every other suite; chrome supplies the
        # H.264 encoder that Chromium does not ship, which is why the MP4 happy
        # path went unverified from v103 onward.
        run: |
          python -m playwright install --with-deps chromium
          python -m playwright install --with-deps chrome
      - name: Run the MP4 suite
        run: ./harness/run_harness.sh verify_mp4.py
      - name: Fail if the MP4 suite only SKIPPED
        # A skip contributes zero assertions and proves nothing about MP4. On
        # the one job whose entire purpose is to prove it, a skip is a failure.
        run: |
          if grep -q "suites skipped   : 0" harness/LAST-RUN.txt; then
            echo "MP4 suite ran."
          else
            echo "MP4 suite SKIPPED on the job that exists to run it." >&2
            cat harness/LAST-RUN.txt >&2
            exit 1
          fi
      - name: Write the MP4 attestation
        # THE RESULT HAS TO REACH THE SEAL. Before this the job proved H.264
        # and the sealed archive said only "skipped 1 (verify_mp4.py)", so a
        # reader could not tell "not covered" from "covered somewhere you
        # cannot see" — an audit of v278 called that an evidence gap, correctly.
        #
        # The TREE HASH is the load-bearing field: release_run.py accepts this
        # file only when it matches the tree the release froze, because an
        # attestation for different code is worse than none.
        run: |
          python - <<'PY' > harness/MP4-ATTESTATION.txt
          import re, sys
          sys.path.insert(0, "harness")
          import release_run as r
          rec = open("harness/LAST-RUN.txt").read()
          n = re.search(r"^assertions passed:\s*(\d+)", rec, re.M)
          print("tree:", r.tree_hash())
          print("channel: chrome")
          print("result: PASS")
          print("assertions:", n.group(1) if n else "?")
          import datetime
          print("generated:",
                datetime.datetime.now(datetime.timezone.utc)
                .strftime("%Y-%m-%dT%H:%M:%SZ"))
          PY
          cat harness/MP4-ATTESTATION.txt
      - name: Upload the MP4 attestation
        uses: actions/upload-artifact@v4
        with:
          name: mp4-attestation
          path: harness/MP4-ATTESTATION.txt

  # SOMEBODY READS MAIN NOW (v314). The battery above runs after a merge, and
  # for a long time nothing read its result: main sat red for about five hours
  # after #221 and again after the v311 merge, both found by accident
  # (DECISIONS v311, v312). The owner chose the reader: an issue, because
  # GitHub already puts a new issue on the owner's phone. A red run opens one,
  # or comments on the one already open; the next fully green run closes it.
  # A cancelled run verified nothing and does neither.
  #
  # always(), because this job has to run precisely when the others FAILED --
  # without it GitHub skips a dependent job on a failed need, and the alarm
  # would be silent in the one case it exists for. Push to main only: a pull
  # request never runs the battery, and a manual dispatch on a branch is
  # somebody already watching. Its token can write issues and nothing else.
  # The decision is harness/tools/mainwatch.py's decide(), which verify_docs
  # drives case by case on every pull request.
  main-watch:
    name: main watch (a red main opens an issue)
    needs: [sqlite, postgres, mp4]
    if: always() && github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@v4
      - name: Open, update or close the red-main issue
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          JOB_RESULTS: '{"sqlite": "${{ needs.sqlite.result }}", "postgres": "${{ needs.postgres.result }}", "mp4": "${{ needs.mp4.result }}"}'
        run: python3 harness/tools/mainwatch.py
