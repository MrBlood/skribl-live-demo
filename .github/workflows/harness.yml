name: harness

# CI runs the same run_harness.sh a developer runs — not a reduced subset —
# across three jobs, because the environments genuinely disagree:
#   sqlite    the default developer path
#   postgres  real parallelism, where the rate-limiter reservation race lives
#   mp4       a browser with an H.264 encoder, which Playwright's Chromium lacks

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# SUPERSEDED PULL-REQUEST RUNS ARE CANCELLED; MAIN RUNS ARE NOT.
#
# Without this, every push to a branch under review started a fresh set of three
# 20-30 minute jobs and left the previous set running to completion against a
# commit nobody would ever merge. On a branch that gets four or five pushes in a
# session that is most of the minutes spent -- and the account ran out of them,
# free allowance and paid top-up both, which is how this got noticed.
#
# The group is per-ref, so two different pull requests never cancel each other.
#
# cancel-in-progress is an EXPRESSION rather than a flat true, and that is the
# point of the block. On a pull request the older run is testing a commit that
# has been replaced and its result would be read by nobody, so cancelling costs
# nothing. On main each commit is a thing that shipped: its run is the only
# record that it was verified, so those queue behind each other instead.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  sqlite:
    name: harness (sqlite)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          # The lock is hash-pinned, so it installs on its own; '-r requirements
          # -c constraints' fails because --require-hashes rejects version ranges.
          pip install -r constraints.txt --require-hashes
          # playwright and Pillow are TEST-only and deliberately absent from
          # constraints.txt, which is the app's runtime lock (it is what the
          # Procfile's gunicorn installs) -- neither is imported by skribl/ or
          # app.py. Pillow backs verify_cssplit's pixel gate, and that suite
          # exits 1 rather than SKIPping when it is missing, so leaving it out
          # fails the job rather than degrading it.
          pip install playwright Pillow
      - name: Install Chromium
        # --with-deps pulls the system libraries headless Chromium needs;
        # without it the browser launches and dies on a missing shared object.
        run: python -m playwright install --with-deps chromium
      - name: Run the harness
        run: ./harness/run_harness.sh
      - name: Upload the run record
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: last-run-sqlite
          path: harness/LAST-RUN.txt

  postgres:
    name: harness (postgresql)
    runs-on: ubuntu-latest
    timeout-minutes: 30

    services:
      db:
        image: postgres:16
        env:
          POSTGRES_USER: skribl
          POSTGRES_PASSWORD: skribl
          POSTGRES_DB: skribl
        ports: ["5432:5432"]
        # Without a health check the steps start before the server accepts
        # connections and the first suite fails for the wrong reason.
        #
        # -U/-d, not a bare pg_isready: the probe runs as root inside the
        # container and pg_isready defaults --username to the OS user, so every
        # 10s probe opened a connection as "root", which this image never
        # creates. The gate still PASSED -- pg_isready reports the server as
        # accepting connections even when it rejects the role -- so nothing
        # broke, but the container logged
        #     FATAL:  role "root" does not exist
        # roughly 140 times across a 24-minute run. That is the log someone
        # reads when a run has genuinely failed, and a wall of FATAL lines in
        # it invites exactly the wrong diagnosis.
        options: >-
          --health-cmd "pg_isready -U skribl -d skribl"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgresql://skribl:skribl@127.0.0.1:5432/skribl
      # verify_postgres.py spawns its own gunicorn and resolves this DSN itself.
      # A SEPARATE database from DATABASE_URL above, created empty by the step
      # that precedes the harness: this suite migrates from scratch, and the
      # database the harness itself uses has had create_all() run over it.
      SKRIBL_PG_DSN: postgresql://skribl:skribl@127.0.0.1:5432/skribl_suite

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          # The lock is hash-pinned, so it installs on its own; '-r requirements
          # -c constraints' fails because --require-hashes rejects version ranges.
          pip install -r constraints.txt --require-hashes
          # playwright and Pillow are TEST-only and deliberately absent from
          # constraints.txt, which is the app's runtime lock (it is what the
          # Procfile's gunicorn installs) -- neither is imported by skribl/ or
          # app.py. Pillow backs verify_cssplit's pixel gate, and that suite
          # exits 1 rather than SKIPping when it is missing, so leaving it out
          # fails the job rather than degrading it.
          pip install playwright Pillow
      - name: Install Chromium
        run: python -m playwright install --with-deps chromium
      - name: Create the empty database verify_postgres migrates into
        # verify_postgres.py runs the alembic chain from scratch, so it needs a
        # database nothing has created tables in behind its back -- the same
        # requirement the "Verify the migration chain" step below already spells
        # out for migrations_only, and for the same reason.
        #
        # SKRIBL_PG_DSN used to point at `skribl`, the database run_harness.sh
        # resets with metadata.create_all(). The tables were therefore already
        # present with no alembic_version row, the baseline revision tried to
        # create them again, and the suite SKIPPED:
        #     could not migrate the schema on PostgreSQL
        # with the server logging `relation "skribl_posts" already exists`.
        #
        # It skipped every time, so the one suite that exercises PostgreSQL has
        # never actually run in CI -- and because run_harness.sh exits non-zero
        # on any skip, the job went red without a single failing assertion,
        # which is how it stayed unexamined. Exactly the v209 lesson in
        # HANDOFF-NEXT-SESSION.md section 5: a run that reports `skipped 1` is
        # not the run you think it is.
        run: |
          PGPASSWORD=skribl psql -h 127.0.0.1 -U skribl -d skribl \
            -c "DROP DATABASE IF EXISTS skribl_suite;" \
            -c "CREATE DATABASE skribl_suite OWNER skribl;"
      - name: Run the harness
        # This job BLOCKS. It was non-blocking while the database-backed limiter
        # admitted zero of twelve concurrent posts; that is fixed (per-identity
        # advisory lock, skribl/ratelimit.py), and the concurrency race is
        # exactly what this job exists to catch, so a non-blocking version of it
        # would be worse than none.
        #
        # run_harness.sh honours an externally supplied DATABASE_URL and resets
        # by dropping and recreating Skribl's tables, so this is a genuine
        # PostgreSQL run with per-run isolation intact.
        run: ./harness/run_harness.sh
      - name: Verify the migration chain on PostgreSQL
        # A SEPARATE, EMPTY database. run_harness.sh resets the supplied one with
        # metadata.create_all(), which leaves the tables present with no
        # alembic_version row — so the baseline revision would then try to create
        # tables that already exist. Exercise the chain where nothing has been
        # created behind its back.
        env:
          DATABASE_URL: postgresql://skribl:skribl@127.0.0.1:5432/migrations_only
        run: |
          PGPASSWORD=skribl psql -h 127.0.0.1 -U skribl -d skribl \
            -c "DROP DATABASE IF EXISTS migrations_only;" \
            -c "CREATE DATABASE migrations_only OWNER skribl;"
          python -m alembic upgrade head
          python -m alembic check
      - name: Upload the run record
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: last-run-postgres
          path: harness/LAST-RUN.txt

  mp4:
    name: mp4 export (real Chrome)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      SKRIBL_BROWSER_CHANNEL: chrome
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          # The lock is hash-pinned, so it installs on its own; '-r requirements
          # -c constraints' fails because --require-hashes rejects version ranges.
          pip install -r constraints.txt --require-hashes
          # playwright and Pillow are TEST-only and deliberately absent from
          # constraints.txt, which is the app's runtime lock (it is what the
          # Procfile's gunicorn installs) -- neither is imported by skribl/ or
          # app.py. Pillow backs verify_cssplit's pixel gate, and that suite
          # exits 1 rather than SKIPping when it is missing, so leaving it out
          # fails the job rather than degrading it.
          pip install playwright Pillow
      - name: Install Chromium and real Chrome
        # chromium serves the app for every other suite; chrome supplies the
        # H.264 encoder that Chromium does not ship, which is why the MP4 happy
        # path went unverified from v103 onward.
        run: |
          python -m playwright install --with-deps chromium
          python -m playwright install --with-deps chrome
      - name: Run the MP4 suite
        run: ./harness/run_harness.sh verify_mp4.py
      - name: Fail if the MP4 suite only SKIPPED
        # A skip contributes zero assertions and proves nothing about MP4. On
        # the one job whose entire purpose is to prove it, a skip is a failure.
        run: |
          if grep -q "suites skipped   : 0" harness/LAST-RUN.txt; then
            echo "MP4 suite ran."
          else
            echo "MP4 suite SKIPPED on the job that exists to run it." >&2
            cat harness/LAST-RUN.txt >&2
            exit 1
          fi
